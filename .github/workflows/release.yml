# 发布工作流：手动触发 → 构建 APK → 打 tag → 创建 GitHub Release。
# 触发方式：仓库 Actions 页选择「Release」→ Run workflow → 填版本号（如 v1.0.0）。
# 说明：本仓库没有签名配置（签名构建在 Roadmap 中），发布物为 app-debug.apk，
#       与 README「到 Releases 下载 app-debug.apk」的指引保持一致。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（同时作为 Git tag，形如 v1.0.0）'
        required: true
        type: string
      notes:
        description: 'Release 说明（可选，置于自动生成的 changelog 之前）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验版本号输入
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号必须形如 v1.2.3（可带 -beta1 等后缀），当前输入：$VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION 已存在，请更换版本号"
            exit 1
          fi

      - name: 安装 JDK 17（Gradle 9.x / AGP 9.x 最低要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（依赖缓存 + wrapper 完整性校验）
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: 预接受 Android SDK 许可（compileSdk 36 平台由 AGP 按需下载）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 构建 APK（./gradlew assembleDebug，与 README「从源码构建」一致）
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 校验产物并生成 SHA-256
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::未找到构建产物：$APK"
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
          echo "APK 大小：$(du -h "$APK" | cut -f1)"

      - name: 打 tag 并创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: HotspotTile ${{ inputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
