# 发布工作流：手动触发 → 构建 APK → 打 tag → 创建 GitHub Release。
# 触发方式：
#   1) 仓库 Actions 页选择「Release」→ Run workflow → 填版本号（如 v1.0.0，可留空自动 bump）；
#   2) release agent（issue-triage-bot release.py）经 `gh workflow run Release` 无参触发——
#      因此 version 输入必须保持可选（required: false），这是与 agent 的硬契约，勿改回必填。
# 版本号：输入优先（形如 v1.0.0，可带 -beta1 等后缀）；留空则自动取上一 v* tag 的 patch+1（首个为 v0.1.0）。
# 签名：keystore 不入库，经 GitHub Secrets（RELEASE_KEYSTORE/KEYSTORE_PASSWORD/
#       KEY_ALIAS/KEY_PASSWORD）在构建时还原为 release 签名；产物为
#       HotspotTile-<version>.apk（assembleRelease，debuggable=false，可覆盖升级）。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（形如 v1.0.0；留空自动取上一 tag patch+1）'
        required: false
        default: ''
        type: string
      notes:
        description: 'Release 说明（可选，置于自动生成的 changelog 之前）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码（完整历史，含 tags）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 版本推导与校验
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            LAST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$LAST" ]; then
              VERSION="v0.1.0"
            else
              CORE="${LAST#v}"; CORE="${CORE%%-*}"
              MAJOR="$(echo "$CORE" | cut -d. -f1)"
              MINOR="$(echo "$CORE" | cut -d. -f2)"
              PATCH="$(echo "$CORE" | cut -d. -f3)"
              VERSION="v$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            echo "未指定版本，自动推导：$VERSION（上一 tag：${LAST:-无}）"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号必须形如 v1.2.3（可带 -beta1 等后缀），当前输入：$VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION 已存在，请更换版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 17（Gradle 9.x / AGP 9.x 最低要求）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（依赖缓存 + wrapper 完整性校验）
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: 预接受 Android SDK 许可（compileSdk 36 平台由 AGP 按需下载）
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 从 Secrets 还原 release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # secret 误配会静默产出空文件、错误延迟到签名阶段才爆——此处即失败
          [[ -s "$RUNNER_TEMP/release.jks" ]] || { echo "::error::keystore 还原为空，检查 RELEASE_KEYSTORE secret"; exit 1; }

      - name: 构建 release APK（签名 + 注入版本号）
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x gradlew
          VN="${VERSION#v}"
          CORE="${VN%%-*}"
          VC=$(echo "$CORE" | awk -F. '{print $1*10000+$2*100+$3}')
          echo "versionName=$VN versionCode=$VC"
          ./gradlew assembleRelease -PversionName="$VN" -PversionCode="$VC" --stacktrace

      - name: 校验产物、改名并生成 SHA-256
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          APK="app/build/outputs/apk/release/HotspotTile-${VERSION#v}.apk"
          if [[ ! -s "$SRC" ]]; then
            echo "::error::未找到构建产物：$SRC"
            exit 1
          fi
          mv "$SRC" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK 大小：$(du -h "$APK" | cut -f1)"

      - name: 打 tag 并创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HotspotTile ${{ steps.ver.outputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/HotspotTile-*.apk
            app/build/outputs/apk/release/HotspotTile-*.apk.sha256
